[project]
name = "ncaab-model-validation"
version = "0.1.0"
description = "A real-data case study in point-in-time features and walk-forward model validation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Pete VanBenthuysen", email = "pete@quadmresearch.com" },
]
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "polars>=1.20,<2",
    "scikit-learn>=1.6,<2",
]

[project.urls]
Repository = "https://github.com/quadm-research/ncaab-model-validation"
Issues = "https://github.com/quadm-research/ncaab-model-validation/issues"

[project.scripts]
ncaab-validate = "ncaab_model_validation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncaab_model_validation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
